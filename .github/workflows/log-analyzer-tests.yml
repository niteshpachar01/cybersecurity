name: SSH Log Analyzer Tests

on:
  push:
    paths:
      - "tools/log-analyzer/**"
      - ".github/workflows/log-analyzer-tests.yml"
  pull_request:
    paths:
      - "tools/log-analyzer/**"
      - ".github/workflows/log-analyzer-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/log-analyzer
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest -v
